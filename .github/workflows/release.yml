name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY != '' }}
      HAS_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: |
          # Swift Testing on macOS 15 can crash during runner shutdown (signal 6/11)
          # even when all tests pass. Capture output and check for actual test failures.
          #
          # The swiftpm-testing-helper occasionally hangs at startup on the macos-15
          # runner pool that release.yml hits — Swift Testing emits all "started"
          # markers up front, then never finishes any of them, and the job blows
          # past its 15-minute timeout. Locally and on workflow_dispatch against
          # the same commit the full suite runs in ~3s, so this is purely a
          # runner-environment flake. Wrap the run in a 6-minute timeout (well
          # under the 15-min job cap), and retry up to 3 times on hang. Real
          # test failures still fail-fast on the failure marker check.
          attempt=1
          max_attempts=3
          per_attempt_timeout=360
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Test attempt $attempt of $max_attempts"
            set +e
            # Use perl alarm for the per-attempt timeout — `gtimeout` isn't preinstalled
            # on macos-15 runners but perl is. `alarm` schedules SIGALRM, then `exec`
            # replaces perl with swift test; default SIGALRM action is to terminate.
            perl -e 'alarm shift @ARGV; exec @ARGV' "$per_attempt_timeout" swift test --skip-build 2>&1 | tee test-output.txt
            exit_code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if grep -q '✘ Test' test-output.txt; then
              echo "Test failures detected — aborting"
              exit 1
            fi
            if grep -q 'error: build' test-output.txt; then
              echo "Build errors detected — aborting"
              exit 1
            fi

            if grep -q 'Test run with .* tests' test-output.txt; then
              echo "Tests passed on attempt $attempt (exit code $exit_code, summary printed)"
              break
            fi

            # Swift Testing on macos-15 frequently SIGSEGVs the test runner
            # during SHUTDOWN — after every test has actually run and passed,
            # but before it prints the "Test run with N tests passed" summary
            # line. Detect this "ran-clean-then-shutdown-crashed" state by
            # counting actual ✔ markers: if we have ≥800 (suite is 980), the
            # tests themselves are clean. See ci.yml for the same logic.
            passed_count=$(grep -c '^✔ Test ' test-output.txt || true)
            if [ "$passed_count" -ge 800 ]; then
              echo "Tests passed on attempt $attempt — $passed_count ✔ markers, no failures, runner exited $exit_code (likely shutdown-time SIGSEGV; tests themselves are clean)"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Test runner produced neither a summary nor ≥800 ✔ markers after $max_attempts attempts (last exit $exit_code, $passed_count passes) — likely true runner-environment hang"
              exit 1
            fi
            echo "No test summary detected (exit $exit_code, $passed_count passes) — retrying"
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Build release
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          SPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.SPARKLE_EDDSA_PUBLIC_KEY }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-app.sh

      - name: Generate checksums
        run: |
          cd .build
          shasum -a 256 AIBattery.zip AIBattery.dmg > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            .build/AIBattery.zip
            .build/AIBattery.dmg
            .build/checksums-sha256.txt
          generate_release_notes: true

      - name: Generate appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/generate-appcast.sh "$VERSION"

      - name: Deploy appcast to gh-pages
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Save appcast before switching branches
          cp .build/appcast.xml /tmp/appcast.xml

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "Update appcast for v${VERSION}" || true
          git push origin gh-pages

      - name: Restore source checkout
        if: env.HAS_SPARKLE_KEY == 'true'
        run: git checkout "$GITHUB_REF_NAME"

      - name: Update Homebrew cask
        if: env.HAS_HOMEBREW_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/update-homebrew.sh "${{ github.ref_name }}"
