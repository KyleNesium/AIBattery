name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY != '' }}
      HAS_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache SPM
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Run tests
        run: |
          set +e
          swift test --skip-build 2>&1 | tee test-output.txt
          exit_code=$?
          set -e
          if grep -q '✘ Test' test-output.txt; then
            echo "Test failures detected"
            exit 1
          fi
          if grep -q 'error: build' test-output.txt; then
            echo "Build errors detected"
            exit 1
          fi
          passed=$(grep -c '✔ Test' test-output.txt || true)
          if [ "$passed" -eq 0 ]; then
            echo "No tests passed — something is wrong"
            exit 1
          fi
          echo "All $passed tests passed (exit code was $exit_code)"

      - name: Build release
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          SPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.SPARKLE_EDDSA_PUBLIC_KEY }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-app.sh

      - name: Generate checksums
        run: |
          cd .build
          shasum -a 256 AIBattery.zip AIBattery.dmg > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            .build/AIBattery.zip
            .build/AIBattery.dmg
            .build/checksums-sha256.txt
          generate_release_notes: true

      - name: Generate appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/generate-appcast.sh "$VERSION"

      - name: Deploy appcast to gh-pages
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Save appcast before switching branches
          cp .build/appcast.xml /tmp/appcast.xml

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "Update appcast for v${VERSION}" || true
          git push origin gh-pages

      - name: Restore source checkout
        if: env.HAS_SPARKLE_KEY == 'true'
        run: git checkout "$GITHUB_REF_NAME"

      - name: Update Homebrew cask
        if: env.HAS_HOMEBREW_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/update-homebrew.sh "${{ github.ref_name }}"
