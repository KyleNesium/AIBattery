name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - 'spec/**'
      - 'LICENSE'
      - '.github/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache SPM
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: |
          # Swift Testing on macos-15 occasionally hangs the swiftpm-testing-helper
          # at startup or shutdown — same fragility documented in release.yml. The
          # helper logs the first `◇ Test ... started` markers, then never finishes
          # any of them, blowing past the job timeout. Locally and on
          # workflow_dispatch the same commit runs the full suite in ~3s, so this
          # is a runner-environment flake.
          #
          # Wrap each attempt in a 6-minute timeout (well under the 15-min job
          # cap) and retry up to 3 times on hang. Real test failures and build
          # errors still fail-fast on their respective markers.
          attempt=1
          max_attempts=3
          per_attempt_timeout=360
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Test attempt $attempt of $max_attempts"
            set +e
            # `gtimeout` isn't preinstalled on macos-15 runners but perl is.
            # `alarm` schedules SIGALRM, then `exec` replaces perl with swift
            # test; default SIGALRM action is to terminate.
            perl -e 'alarm shift @ARGV; exec @ARGV' "$per_attempt_timeout" swift test --skip-build 2>&1 | tee test-output.txt
            exit_code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if grep -q '✘ Test' test-output.txt; then
              echo "Test failures detected — aborting"
              exit 1
            fi
            if grep -q 'error: build' test-output.txt; then
              echo "Build errors detected — aborting"
              exit 1
            fi

            if grep -q 'Test run with .* tests' test-output.txt; then
              echo "Tests passed on attempt $attempt (exit code $exit_code)"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Test runner failed to produce a summary after $max_attempts attempts (last exit $exit_code) — likely runner-environment hang"
              exit 1
            fi
            echo "No test summary detected (exit $exit_code) — retrying"
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Verify app bundle
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep .build/AIBattery.app
          echo "Codesign OK"
          # Verify Sparkle XPC identifiers match bundle IDs (prevents auto-update breakage)
          for xpc in .build/AIBattery.app/Contents/Frameworks/Sparkle.framework/Versions/Current/XPCServices/*.xpc; do
            [ -e "$xpc" ] || continue
            expected=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$xpc/Contents/Info.plist")
            actual=$(codesign -dv "$xpc" 2>&1 | grep "^Identifier=" | cut -d= -f2)
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: $(basename "$xpc") id mismatch: expected=$expected actual=$actual"
              exit 1
            fi
          done
          echo "XPC identity check OK"
