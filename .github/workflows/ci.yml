name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'spec/**'
      - 'LICENSE'
      - '.github/*.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'spec/**'
      - 'LICENSE'
      - '.github/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: |
          # Swift Testing on macOS 15 can crash during runner shutdown (signal 6/11)
          # even when all tests pass. Capture output and check for actual test failures.
          set +e
          swift test --skip-build 2>&1 | tee test-output.txt
          exit_code=$?
          set -e
          if grep -q '✘ Test' test-output.txt; then
            echo "Test failures detected"
            exit 1
          fi
          if grep -q 'error: build' test-output.txt; then
            echo "Build errors detected"
            exit 1
          fi
          passed=$(grep -c '✔ Test' test-output.txt || true)
          echo "All $passed tests passed (exit code was $exit_code)"

      - name: Verify app bundle
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep .build/AIBattery.app
          echo "Codesign OK"
          # Verify Sparkle XPC identifiers match bundle IDs (prevents auto-update breakage)
          for xpc in .build/AIBattery.app/Contents/Frameworks/Sparkle.framework/Versions/Current/XPCServices/*.xpc; do
            [ -e "$xpc" ] || continue
            expected=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$xpc/Contents/Info.plist")
            actual=$(codesign -dv "$xpc" 2>&1 | grep "^Identifier=" | cut -d= -f2)
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: $(basename "$xpc") id mismatch: expected=$expected actual=$actual"
              exit 1
            fi
          done
          echo "XPC identity check OK"
