name: CI

on:
  # Run on every push to main so the README badge tracks integration-branch
  # health. Without this, the badge stays frozen on whatever the most-recent
  # workflow run was — even when that was a cancelled manual dispatch from
  # weeks ago — and shows red despite main being green.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'spec/**'
      - 'LICENSE'
      - '.github/*.md'
  # On PRs, only fire when the PR transitions out of draft. We deliberately do
  # NOT include `synchronize` (= every push to the PR branch) because that
  # produces dozens of skipped runs per feature-branch life and clutters the
  # Actions tab. The flow is: develop in draft → mark ready when you want a
  # validation pass → CI runs once. Use `workflow_dispatch` to force a re-run
  # without leaving and re-entering draft.
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths-ignore:
      - '**.md'
      - 'spec/**'
      - 'LICENSE'
      - '.github/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Verify
    # Defensive: with the triggers above, drafts never reach this workflow at
    # all (only `ready_for_review` is wired). Keeping the check belt-and-braces
    # in case the trigger config gets relaxed later.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: macos-15
    # Bumped from 10 → 22: the test step has 3 × 6-minute retry attempts for
    # macos-15 swiftpm-testing-helper hangs. At 10 minutes the job timeout
    # cancelled before the retry logic could try a second attempt — observed
    # twice on v2.3.1 PR runs. 22 = 3 × 6 retry budget + 4 min for build/cache
    # /cleanup overhead.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache SPM
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: |
          # Swift Testing on macos-15 occasionally hangs the swiftpm-testing-helper
          # at startup or shutdown — same fragility documented in release.yml. The
          # helper logs the first `◇ Test ... started` markers, then never finishes
          # any of them, blowing past the job timeout. Locally and on
          # workflow_dispatch the same commit runs the full suite in ~3s, so this
          # is a runner-environment flake.
          #
          # Wrap each attempt in a 6-minute timeout (well under the 15-min job
          # cap) and retry up to 3 times on hang. Real test failures and build
          # errors still fail-fast on their respective markers.
          attempt=1
          max_attempts=3
          per_attempt_timeout=360
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Test attempt $attempt of $max_attempts"
            set +e
            # `gtimeout` isn't preinstalled on macos-15 runners but perl is.
            # `alarm` schedules SIGALRM, then `exec` replaces perl with swift
            # test; default SIGALRM action is to terminate.
            perl -e 'alarm shift @ARGV; exec @ARGV' "$per_attempt_timeout" swift test --skip-build 2>&1 | tee test-output.txt
            exit_code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if grep -q '✘ Test' test-output.txt; then
              echo "Test failures detected — aborting"
              exit 1
            fi
            if grep -q 'error: build' test-output.txt; then
              echo "Build errors detected — aborting"
              exit 1
            fi

            if grep -q 'Test run with .* tests' test-output.txt; then
              echo "Tests passed on attempt $attempt (exit code $exit_code, summary printed)"
              break
            fi

            # Swift Testing on macos-15 frequently SIGSEGVs the test runner
            # during SHUTDOWN — after every test has actually run and passed,
            # but before it prints the "Test run with N tests passed" summary
            # line. The runner's exit code is non-zero (signal-killed) but no
            # ✘ markers appear in the output. Detect this "ran-clean-then-
            # shutdown-crashed" state by counting actual ✔ test markers: if
            # we have ≥800 passes (current suite is 980), the suite ran.
            passed_count=$(grep -c '^✔ Test ' test-output.txt || true)
            if [ "$passed_count" -ge 800 ]; then
              echo "Tests passed on attempt $attempt — $passed_count ✔ markers, no failures, runner exited $exit_code (likely shutdown-time SIGSEGV; tests themselves are clean)"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Test runner produced neither a summary nor ≥800 ✔ markers after $max_attempts attempts (last exit $exit_code, $passed_count passes) — likely true runner-environment hang"
              exit 1
            fi
            echo "No test summary detected (exit $exit_code, $passed_count passes) — retrying"
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Verify app bundle
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep .build/AIBattery.app
          echo "Codesign OK"
          # Verify Sparkle XPC identifiers match bundle IDs (prevents auto-update breakage)
          for xpc in .build/AIBattery.app/Contents/Frameworks/Sparkle.framework/Versions/Current/XPCServices/*.xpc; do
            [ -e "$xpc" ] || continue
            expected=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$xpc/Contents/Info.plist")
            actual=$(codesign -dv "$xpc" 2>&1 | grep "^Identifier=" | cut -d= -f2)
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: $(basename "$xpc") id mismatch: expected=$expected actual=$actual"
              exit 1
            fi
          done
          echo "XPC identity check OK"
